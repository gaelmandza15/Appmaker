[package]
name = "appmaker-host"
version = "0.1.0"
description = "Hôte AppMaker générique : charge une application et sa base SQLite depuis resources/"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["image-png"] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
